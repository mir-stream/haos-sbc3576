# Initial image only: retain the vendor DDR/SPL/ATF/U-Boot boot chain.
image spl.img {
    size = ${BOOT_SPL_SIZE}
    hdimage {
        partition-table-type = "none"
        fill = "yes"
    }
    partition idbloader {
        offset = 32k
        image = "idbloader.img"
    }
    partition uboot {
        offset = 8M
        image = "uboot.img"
    }
}
