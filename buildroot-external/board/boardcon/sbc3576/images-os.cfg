# The existing vendor U-Boot reads FAT but has no SquashFS or LZO support.
image kernel.img {
    size = ${KERNEL_SIZE}
    srcpath = "${BINARIES_DIR}/kernel-slot"
    vfat {
        label = "haos-kernel"
    }
}

image overlay.ext4 {
    size = ${OVERLAY_SIZE}
    empty = "yes"
    ext4 {
        use-mke2fs = "yes"
        label = "hassos-overlay"
        extraargs = "-I 256 -E lazy_itable_init=0,lazy_journal_init=0"
    }
}
